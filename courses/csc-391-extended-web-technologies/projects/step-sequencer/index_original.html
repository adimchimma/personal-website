<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Sequencer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

  <!-- Monospace display font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg:          #09090f;
      --surface:     #111118;
      --surface-2:   #18181f;
      --border:      #252530;
      --text:        #c8c8d8;
      --dim:         #55556a;
      --accent:      #f59e0b;       /* amber — transport / active steps */
      --playhead:    #38bdf8;       /* sky blue — current-step highlight */
      --step-off:    #0d0d16;

      /* Per-track accent colours */
      --c0: #f59e0b;   /* Kick    — amber  */
      --c1: #f43f5e;   /* Snare   — rose   */
      --c2: #38bdf8;   /* Hi-Hat  — sky    */
      --c3: #06b6d4;   /* Open HH — cyan   */
      --c4: #a78bfa;   /* Clap    — violet */
      --c5: #84cc16;   /* Tom     — lime   */
      --c6: #10b981;   /* Bass    — emerald*/
      --c7: #f472b6;   /* Lead    — pink   */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;

      /* Subtle dot-grid texture */
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── Header ────────────────────────────────────────────── */
    header { text-align: center; margin-bottom: 28px; }

    header h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--accent);
    }

    header p {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--dim);
      margin-top: 4px;
    }

    /* ── Transport bar ─────────────────────────────────────── */
    .transport {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 22px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    #play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }

    #play-btn:hover,
    #play-btn.playing {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 18px rgba(245,158,11,0.35);
    }

    #stop-btn {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.1s, color 0.1s;
    }

    #stop-btn:hover { border-color: var(--text); color: var(--text); }

    .bpm-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bpm-group label {
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--dim);
    }

    .bpm-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      width: 130px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    #bpm-display {
      font-size: 1.1rem;
      color: var(--accent);
      min-width: 52px;
    }

    .transport-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: auto;
    }

    .transport-info span {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--dim);
    }

    .transport-info .step-counter {
      font-size: 1rem;
      color: var(--playhead);
    }

    /* ── Sequencer grid ────────────────────────────────────── */
    .sequencer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 1020px;
    }

    /* Beat-group labels (1, 2, 3, 4) above the grid */
    .beat-labels {
      display: grid;
      grid-template-columns: 110px 36px 1fr;
      gap: 10px;
      margin-bottom: 6px;
    }

    .beat-labels-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .beat-label {
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--dim);
    }

    /* One track row */
    .track {
      display: grid;
      grid-template-columns: 110px 36px 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .track-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: right;
      white-space: nowrap;
    }

    /* Mute button */
    .mute-btn {
      width: 36px;
      height: 36px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      font-size: 0.55rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .mute-btn.muted {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* 16 step buttons per track */
    .steps {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
    }

    .step {
      height: 34px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--step-off);
      cursor: pointer;
      transition: background 0.07s, border-color 0.07s;
      position: relative;
    }

    /* Slight gap every 4 steps to indicate beats */
    .step:nth-child(4n+1) { margin-left: 4px; }

    /* Step is toggled ON */
    .step.on {
      background: var(--track-color);
      border-color: var(--track-color);
    }

    /* Current step (playhead) */
    .step.playhead {
      outline: 2px solid var(--playhead);
      outline-offset: 1px;
      z-index: 1;
    }

    /* Lit-up when BOTH on and playhead */
    .step.on.playhead {
      filter: brightness(1.5);
    }

    /* ── Effects / mixer panel ─────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 16px;
      width: 100%;
      max-width: 1020px;
    }

    .panel h2 {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .effects-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .effect-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 130px;
    }

    .effect-group label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--dim);
    }

    .effect-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .effect-row input[type="range"] { width: 110px; }

    .effect-val {
      font-size: 0.75rem;
      color: var(--text);
      min-width: 34px;
    }

    /* ── Swing label pill ──────────────────────────────────── */
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--dim);
    }

    /* ── Pattern buttons ───────────────────────────────────── */
    .pattern-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }

    .pattern-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>STEP SEQUENCER</h1>
    <p>TONE.JS · 8 TRACKS · 16 STEPS</p>
  </header>

  <!-- Transport controls -->
  <div class="transport">
    <button id="play-btn" title="Play / Pause">▶</button>
    <button id="stop-btn" title="Stop & Reset">■</button>

    <div class="bpm-group">
      <label>TEMPO</label>
      <div class="bpm-row">
        <input type="range" id="bpm-slider" min="60" max="200" value="120" step="1" />
        <span id="bpm-display">120 BPM</span>
      </div>
    </div>

    <!-- Swing amount -->
    <div class="bpm-group">
      <label>SWING</label>
      <div class="bpm-row">
        <input type="range" id="swing-slider" min="0" max="1" value="0" step="0.01" />
        <span id="swing-display" class="effect-val">0%</span>
      </div>
    </div>

    <div class="transport-info">
      <span>STEP</span>
      <span class="step-counter" id="step-counter">–</span>
    </div>

    <!-- Pattern utilities -->
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;">
      <button class="pattern-btn" id="randomize-btn">RANDOM</button>
      <button class="pattern-btn" id="clear-btn">CLEAR</button>
      <button class="pattern-btn" id="save-btn">SAVE</button>
      <button class="pattern-btn" id="load-btn">LOAD</button>
    </div>
  </div>

  <!-- Main grid (built by JS) -->
  <div class="sequencer" id="sequencer">
    <!-- Beat labels row injected by JS -->
  </div>

  <!-- Master effects panel -->
  <div class="panel">
    <h2>FX · MASTER CHAIN</h2>
    <div class="effects-row">

      <div class="effect-group">
        <label>REVERB MIX</label>
        <div class="effect-row">
          <input type="range" id="reverb-mix" min="0" max="1" step="0.01" value="0.15" />
          <span class="effect-val" id="reverb-val">15%</span>
        </div>
      </div>

      <div class="effect-group">
        <label>DELAY MIX</label>
        <div class="effect-row">
          <input type="range" id="delay-mix" min="0" max="1" step="0.01" value="0" />
          <span class="effect-val" id="delay-val">0%</span>
        </div>
      </div>

      <div class="effect-group">
        <label>MASTER VOL</label>
        <div class="effect-row">
          <input type="range" id="master-vol" min="-30" max="0" step="1" value="-6" />
          <span class="effect-val" id="vol-val">-6 dB</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       TONE.JS STEP SEQUENCER — Scaffold
       ───────────────────────────────────────────────────────────
       Key Tone.js concepts used here:
         • Tone.Transport   — global clock / BPM / swing
         • Tone.Sequence    — schedules 16 steps per bar
         • Tone.MembraneSynth / NoiseSynth / MetalSynth / Synth
         • Tone.Reverb / FeedbackDelay — effects
         • Tone.Channel     — per-track gain + mute routing
         • Tone.Master      — final output volume
    ═══════════════════════════════════════════════════════════ */

    const NUM_STEPS  = 16;
    const NUM_TRACKS = 8;

    /* ── 1. Master effects chain ──────────────────────────── */
    const masterVol = new Tone.Volume(-6).toDestination();
    const reverb    = new Tone.Reverb({ decay: 2.5, wet: 0.15 }).connect(masterVol);
    const delay     = new Tone.FeedbackDelay({ delayTime: '8n', feedback: 0.3, wet: 0 }).connect(reverb);

    /* ── 2. Track definitions ─────────────────────────────── */
    /*
      Each track has:
        name      — displayed in the UI
        color     — CSS variable name for step button colour
        channel   — Tone.Channel for per-track gain/mute routing
        synth     — the Tone.js instrument
        trigger() — function called every active step
    */
    const tracks = [
      {
        name: 'KICK',
        color: '--c0',
        channel: new Tone.Channel({ volume: 0, pan: 0 }).connect(delay),
        synth: new Tone.MembraneSynth({
          pitchDecay: 0.05,
          octaves: 8,
          envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.1 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('C1', '8n', time); }
      },
      {
        name: 'SNARE',
        color: '--c1',
        channel: new Tone.Channel({ volume: -3 }).connect(delay),
        synth: new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.05 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('16n', time); }
      },
      {
        name: 'HI-HAT C',
        color: '--c2',
        channel: new Tone.Channel({ volume: -6 }).connect(delay),
        synth: new Tone.MetalSynth({
          frequency: 400,
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          envelope: { attack: 0.001, decay: 0.06, release: 0.01 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('32n', time); }
      },
      {
        name: 'HI-HAT O',
        color: '--c3',
        channel: new Tone.Channel({ volume: -6 }).connect(delay),
        synth: new Tone.MetalSynth({
          frequency: 400,
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          envelope: { attack: 0.001, decay: 0.4, release: 0.1 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('8n', time); }
      },
      {
        name: 'CLAP',
        color: '--c4',
        channel: new Tone.Channel({ volume: -4 }).connect(delay),
        synth: new Tone.NoiseSynth({
          noise: { type: 'pink' },
          envelope: { attack: 0.005, decay: 0.12, sustain: 0, release: 0.05 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('16n', time); }
      },
      {
        name: 'TOM',
        color: '--c5',
        channel: new Tone.Channel({ volume: -2 }).connect(delay),
        synth: new Tone.MembraneSynth({
          pitchDecay: 0.12,
          octaves: 4,
          envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.1 }
        }),
        trigger(time) { this.synth.triggerAttackRelease('G1', '8n', time); }
      },
      {
        name: 'BASS',
        color: '--c6',
        channel: new Tone.Channel({ volume: -2 }).connect(delay),
        synth: new Tone.Synth({
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.1 }
        }),
        /* Bass cycles through a simple root-fifth pattern */
        noteIndex: 0,
        notes: ['C2', 'C2', 'G2', 'C2'],
        trigger(time) {
          const note = this.notes[this.noteIndex % this.notes.length];
          this.noteIndex++;
          this.synth.triggerAttackRelease(note, '8n', time);
        }
      },
      {
        name: 'LEAD',
        color: '--c7',
        channel: new Tone.Channel({ volume: -5 }).connect(delay),
        synth: new Tone.Synth({
          oscillator: { type: 'sawtooth' },
          envelope: { attack: 0.02, decay: 0.1, sustain: 0.4, release: 0.2 }
        }),
        /* Lead picks from a pentatonic scale */
        noteIndex: 0,
        notes: ['C4', 'E4', 'G4', 'A4', 'C5', 'A4', 'G4', 'E4'],
        trigger(time) {
          const note = this.notes[this.noteIndex % this.notes.length];
          this.noteIndex++;
          this.synth.triggerAttackRelease(note, '16n', time);
        }
      }
    ];

    /* Connect all instruments through their channels */
    tracks.forEach(t => t.synth.connect(t.channel));

    /* ── 3. Step state ────────────────────────────────────── */
    /*
      steps[trackIndex][stepIndex] = true | false
      Start with a simple kick-snare pattern to demonstrate the sequencer.
    */
    const steps = Array.from({ length: NUM_TRACKS }, () =>
      Array(NUM_STEPS).fill(false)
    );

    /* Default pattern — kick on 1 & 3, snare on 2 & 4 */
    [0, 4, 8, 12].forEach(i => { steps[0][i] = true; });   // kick
    [4, 12].forEach(i       => { steps[1][i] = true; });    // snare
    [0,2,4,6,8,10,12,14].forEach(i => { steps[2][i] = true; }); // hi-hat

    /* muted[trackIndex] = true means that track is silenced */
    const muted = Array(NUM_TRACKS).fill(false);

    /* ── 4. Build the UI ──────────────────────────────────── */
    const sequencerEl = document.getElementById('sequencer');

    /* Beat-group labels */
    const beatLabelRow = document.createElement('div');
    beatLabelRow.className = 'beat-labels';
    beatLabelRow.innerHTML = `
      <div></div><div></div>
      <div class="beat-labels-inner">
        <div class="beat-label">BEAT 1</div>
        <div class="beat-label">BEAT 2</div>
        <div class="beat-label">BEAT 3</div>
        <div class="beat-label">BEAT 4</div>
      </div>`;
    sequencerEl.appendChild(beatLabelRow);

    /* Track rows + step buttons */
    const stepButtons = []; // stepButtons[track][step] → <button>

    tracks.forEach((track, ti) => {
      const row = document.createElement('div');
      row.className = 'track';

      /* Label */
      const label = document.createElement('div');
      label.className = 'track-label';
      label.textContent = track.name;

      /* Mute button */
      const muteBtn = document.createElement('button');
      muteBtn.className = 'mute-btn';
      muteBtn.textContent = 'M';
      muteBtn.title = `Mute ${track.name}`;
      muteBtn.addEventListener('click', () => {
        muted[ti] = !muted[ti];
        muteBtn.classList.toggle('muted', muted[ti]);
        track.channel.mute = muted[ti];
      });

      /* Step buttons */
      const stepsEl = document.createElement('div');
      stepsEl.className = 'steps';
      stepButtons[ti] = [];

      for (let si = 0; si < NUM_STEPS; si++) {
        const btn = document.createElement('button');
        btn.className = 'step';
        btn.style.setProperty('--track-color', `var(${track.color})`);

        /* Initialise from default pattern */
        if (steps[ti][si]) btn.classList.add('on');

        btn.addEventListener('click', () => {
          steps[ti][si] = !steps[ti][si];
          btn.classList.toggle('on', steps[ti][si]);
        });

        stepsEl.appendChild(btn);
        stepButtons[ti][si] = btn;
      }

      row.appendChild(label);
      row.appendChild(muteBtn);
      row.appendChild(stepsEl);
      sequencerEl.appendChild(row);
    });

    /* ── 5. Tone.Sequence (the heart of the sequencer) ────── */
    let currentStep = -1;

    const seq = new Tone.Sequence(
      (time, step) => {
        /* This callback runs on the audio thread (worker),
           so DOM updates must be deferred with Tone.getDraw(). */

        /* Trigger every track that has this step active */
        tracks.forEach((track, ti) => {
          if (steps[ti][step]) {
            track.trigger(time);
          }
        });

        /* Schedule a visual update on the next animation frame */
        Tone.getDraw().schedule(() => {
          updatePlayhead(step);
        }, time);
      },
      [...Array(NUM_STEPS).keys()],  // values passed to callback: 0-15
      '16n'                          // subdivision: sixteenth note
    );

    /* ── 6. Playhead visual ───────────────────────────────── */
    function updatePlayhead(step) {
      /* Remove old playhead highlights */
      if (currentStep !== -1) {
        for (let ti = 0; ti < NUM_TRACKS; ti++) {
          stepButtons[ti][currentStep]?.classList.remove('playhead');
        }
      }
      /* Add new playhead highlights */
      for (let ti = 0; ti < NUM_TRACKS; ti++) {
        stepButtons[ti][step]?.classList.add('playhead');
      }
      currentStep = step;
      document.getElementById('step-counter').textContent =
        `${step + 1} / ${NUM_STEPS}`;
    }

    function clearPlayhead() {
      if (currentStep !== -1) {
        for (let ti = 0; ti < NUM_TRACKS; ti++) {
          stepButtons[ti][currentStep]?.classList.remove('playhead');
        }
      }
      currentStep = -1;
      document.getElementById('step-counter').textContent = '–';
    }

    /* ── 7. Transport controls ────────────────────────────── */
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');

    playBtn.addEventListener('click', async () => {
      /* AudioContext must be resumed after a user gesture */
      await Tone.start();

      if (Tone.Transport.state === 'started') {
        Tone.Transport.pause();
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
      } else {
        seq.start(0);
        Tone.Transport.start();
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
      }
    });

    stopBtn.addEventListener('click', () => {
      Tone.Transport.stop();
      seq.stop();
      seq.cancel();
      clearPlayhead();
      playBtn.textContent = '▶';
      playBtn.classList.remove('playing');
    });

    /* ── 8. BPM ───────────────────────────────────────────── */
    const bpmSlider  = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');

    Tone.Transport.bpm.value = 120;

    bpmSlider.addEventListener('input', () => {
      const bpm = parseInt(bpmSlider.value);
      Tone.Transport.bpm.value = bpm;
      bpmDisplay.textContent   = `${bpm} BPM`;
    });

    /* ── 9. Swing ─────────────────────────────────────────── */
    const swingSlider  = document.getElementById('swing-slider');
    const swingDisplay = document.getElementById('swing-display');

    swingSlider.addEventListener('input', () => {
      const val = parseFloat(swingSlider.value);
      Tone.Transport.swing     = val;
      Tone.Transport.swingSubdivision = '16n';
      swingDisplay.textContent = `${Math.round(val * 100)}%`;
    });

    /* ── 10. Master effects ───────────────────────────────── */
    document.getElementById('reverb-mix').addEventListener('input', function () {
      reverb.wet.value = parseFloat(this.value);
      document.getElementById('reverb-val').textContent =
        `${Math.round(this.value * 100)}%`;
    });

    document.getElementById('delay-mix').addEventListener('input', function () {
      delay.wet.value = parseFloat(this.value);
      document.getElementById('delay-val').textContent =
        `${Math.round(this.value * 100)}%`;
    });

    document.getElementById('master-vol').addEventListener('input', function () {
      masterVol.volume.value = parseFloat(this.value);
      document.getElementById('vol-val').textContent = `${this.value} dB`;
    });

    /* ── 11. Pattern utilities ────────────────────────────── */
    document.getElementById('randomize-btn').addEventListener('click', () => {
      tracks.forEach((_, ti) => {
        for (let si = 0; si < NUM_STEPS; si++) {
          /* Percussion tracks: ~30% fill. Melodic: ~20% */
          const density = ti < 5 ? 0.30 : 0.20;
          steps[ti][si] = Math.random() < density;
          stepButtons[ti][si].classList.toggle('on', steps[ti][si]);
        }
      });
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      tracks.forEach((_, ti) => {
        for (let si = 0; si < NUM_STEPS; si++) {
          steps[ti][si] = false;
          stepButtons[ti][si].classList.remove('on');
        }
      });
    });

    /* Save pattern to localStorage */
    document.getElementById('save-btn').addEventListener('click', () => {
      localStorage.setItem('sequencer-pattern', JSON.stringify(steps));
      alert('Pattern saved!');
    });

    /* Load pattern from localStorage */
    document.getElementById('load-btn').addEventListener('click', () => {
      const saved = localStorage.getItem('sequencer-pattern');
      if (!saved) { alert('No saved pattern found.'); return; }
      const loaded = JSON.parse(saved);
      loaded.forEach((trackSteps, ti) => {
        trackSteps.forEach((on, si) => {
          steps[ti][si] = on;
          stepButtons[ti][si].classList.toggle('on', on);
        });
      });
    });

  </script>
</body>
</html>
