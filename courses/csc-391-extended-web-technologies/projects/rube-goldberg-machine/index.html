    <script>
        function parseList(value) {
            return (value || '')
                .split(',')
                .map((item) => item.trim())
                .filter(Boolean);
        }

        function emitToSelector(sceneEl, selector, eventName) {
            if (!sceneEl || !selector || !eventName) {
                return;
            }

            const targetEl = sceneEl.querySelector(selector);
            if (targetEl) {
                targetEl.emit(eventName);
            }
        }

        AFRAME.registerComponent('emit-on-click', {
            schema: {
                targets: { type: 'string', default: '' },
                events: { type: 'string', default: '' },
                once: { type: 'boolean', default: false }
            },
            init: function () {
                this.hasFired = false;
                this.onClick = () => {
                    if (this.data.once && this.hasFired) {
                        return;
                    }

                    const targets = parseList(this.data.targets);
                    const events = parseList(this.data.events);

                    targets.forEach((selector, index) => {
                        const eventName = events[index] || events[0];
                        emitToSelector(this.el.sceneEl, selector, eventName);
                    });

                    this.hasFired = true;
                };

                this.el.addEventListener('click', this.onClick);
            },
            remove: function () {
                this.el.removeEventListener('click', this.onClick);
            }
        });

        AFRAME.registerComponent('emit-on-animationcomplete', {
            schema: {
                animation: { type: 'string', default: '' },
                targets: { type: 'string', default: '' },
                event: { type: 'string', default: '' }
            },
            init: function () {
                const animationName = (this.data.animation || '').trim();
                const eventName = (this.data.event || '').trim();

                if (!animationName || !eventName) {
                    return;
                }

                this.onAnimationComplete = () => {
                    const targets = parseList(this.data.targets);
                    targets.forEach((selector) => emitToSelector(this.el.sceneEl, selector, eventName));
                };

                this.el.addEventListener(`animationcomplete__${animationName}`, this.onAnimationComplete);
            },
            remove: function () {
                const animationName = (this.data.animation || '').trim();
                if (animationName && this.onAnimationComplete) {
                    this.el.removeEventListener(`animationcomplete__${animationName}`, this.onAnimationComplete);
                }
            }
        });
    </script>
</body>
